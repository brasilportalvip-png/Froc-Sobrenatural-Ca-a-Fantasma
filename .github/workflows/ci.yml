name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Lint, Test & Build Gate
    runs-on: ubuntu-latest
    env:
      CI: true
      NODE_ENV: test
      FIREBASE_PROJECT_ID: froc-sobrenatural
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck / Lint
        run: npm run lint

      - name: Run Test Suite
        run: npm test

      - name: Build Application & API
        run: npm run build

      - name: Install Playwright Browsers & Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run E2E Integration Suite
        run: npm run test:e2e
